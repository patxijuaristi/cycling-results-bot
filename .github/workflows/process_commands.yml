name: Process Telegram Commands

on:
  # Triggered by the Cloudflare Worker webhook relay when a Telegram message arrives
  repository_dispatch:
    types: [telegram-command]
  # Also available for manual triggering from the GitHub Actions UI
  workflow_dispatch:

# Prevent concurrent runs from causing git push conflicts
concurrency:
  group: config-update
  cancel-in-progress: false

jobs:
  process-commands:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Process Telegram commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBHOOK_COMMAND: ${{ github.event.client_payload.command }}
          WEBHOOK_CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: python src/main.py --commands-only

      - name: Commit config changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.json
          git diff --cached --quiet || git commit -m "Update race config via Telegram command"
          git push
